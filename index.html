<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Repas & Courses</title>
  <meta name="description" content="Les repas de la semaine et la liste de courses, partagés en famille.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FBF7F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1917" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icone.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icone-192.png" sizes="192x192" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600,100&display=swap" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="entete">
    <a class="marque" href="#/semaine" aria-label="Repas &amp; Courses, accueil" hidden>
      <svg class="marque-icone" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="currentColor"/><g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="28"><path d="M206 196c-16-20 16-34 0-58M256 196c-16-20 16-34 0-58M306 196c-16-20 16-34 0-58"/></g><path fill="#fff" d="M126 236h260a10 10 0 0 1 10 10v8a10 10 0 0 1-10 10h-6a124 124 0 0 1-248 0h-6a10 10 0 0 1-10-10v-8a10 10 0 0 1 10-10Z"/></svg>
      <span>Repas &amp; Courses</span>
    </a>
    <div class="entete-droite">
      <p class="hors-ligne" id="hors-ligne" role="status" hidden><span class="hors-ligne-point" aria-hidden="true"></span>Hors ligne</p>
      <button class="avatar" id="bouton-profil" type="button" aria-label="Mon profil" aria-haspopup="dialog" hidden></button>
    </div>
  </header>

  <div class="bandeau-apercu" id="bandeau-apercu" hidden>
    <span>👀 Aperçu de la vue «&nbsp;Repas et courses&nbsp;»</span>
    <button class="bandeau-apercu-bouton" id="quitter-apercu" type="button">Quitter</button>
  </div>

  <main id="ecran" tabindex="-1">
    <noscript><p class="noscript">Activez JavaScript pour utiliser Repas &amp; Courses.</p></noscript>
  </main>

  <nav class="onglets" id="onglets" aria-label="Navigation principale" hidden>
    <a class="onglet" href="#/semaine" data-route="semaine">
      <span class="onglet-icone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
      <span>Semaine</span>
    </a>
    <a class="onglet" href="#/courses" data-route="courses">
      <span class="onglet-icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.5h17l-1.7 9.1a2 2 0 0 1-2 1.6H7.2a2 2 0 0 1-2-1.6L3.5 9.5Z"/><path d="M8.5 9.5 11 4M15.5 9.5 13 4M9.5 13.5v3M14.5 13.5v3"/></svg></span>
      <span>Courses</span>
    </a>
    <a class="onglet" href="#/plats" data-route="plats">
      <span class="onglet-icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10.5h14V16a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4v-5.5Z"/><path d="M2.5 10.5h19M9 7c0-1.2 1-2.2 3-2.2s3 1 3 2.2"/></svg></span>
      <span>Plats</span>
    </a>
    <a class="onglet" href="#/decouvrir" data-route="decouvrir">
      <span class="onglet-icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20Z"/></svg></span>
      <span>Découvrir</span>
    </a>
  </nav>

  <p class="annonce" id="annonce" role="status" aria-live="polite"></p>

  <dialog class="feuille" id="panneau-profil" aria-labelledby="profil-titre"></dialog>
</body>
</html>
